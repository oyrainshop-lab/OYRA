<script>

function onData(c,arr,fc){S[c]=arr.sort(SORT[c]);LOADED[c]=!fc;if(c==='cat'&&S.cat.length){try{localStorage.setItem('oyra_categories',JSON.stringify(S.cat.map(x=>x.name)))}catch(e){}}if(c==='cust'&&!fc&&!S.cust.length&&O()&&!SEEDED){SEEDED=true;S.cust.push({id:uid(),name:'Walk-in Customer',phone:'\u2014'});save()}if(LOADED.cat&&LOADED.items&&O()&&!SEEDC){SEEDC=true;let f=null;try{f=localStorage.getItem('oyra_defcats2')}catch(e){}if(!f){const have=new Set(S.cat.map(c=>c.name.toLowerCase()));DEFAULT_CATS.forEach(n=>{if(!have.has(n.toLowerCase()))S.cat.push({id:uid(),name:n})});try{localStorage.setItem('oyra_defcats2','1')}catch(e){}save()}}cancelAnimationFrame(RAF);RAF=requestAnimationFrame(render)}
function onStaff(l){STF=l;if(tab==='staff')render()}
function onAuth(role,email){ROLE=role;EMAIL=email||'';const L=$('L');
 if(role){L.style.display='none';if(!O()&&!['dash','sales','items','cust'].includes(tab))tab='dash';sv(EMAIL+' \u00b7 '+role);render()}
 else{S={items:[],cust:[],inv:[],exp:[],pur:[],cat:[]};L.style.display='flex';$('lm').textContent=email?email+' is not approved yet. Ask the owner to add this email under Staff.':'Sign in to continue';$('lg').style.display=email?'none':'';$('lo').style.display=email?'':'none'}}

function addStaff(){modal('Add staff',`<label>Gmail address</label><input id="se" type="email" placeholder="name@gmail.com">`,()=>{const e=$('se').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return false;FB.addStaff(e)})}
let HSV=false;try{HSV=localStorage.getItem('oyra-hsv')==='1'}catch(e){}

const cleanCat=n=>(n||'').replace(/[<>&"'`]/g,'').trim();
const DEFAULT_CATS=['Perfume','Accessories','Air Freshener','Toys','Watch','Watches','Attar','Gift Box'];
function cats(){const s=new Set(S.cat.map(c=>c.name));S.items.forEach(x=>s.add(x.cat));if(!s.size){let l=null;try{l=JSON.parse(localStorage.getItem('oyra_categories'))}catch(e){}(Array.isArray(l)&&l.length?l:DEFAULT_CATS).forEach(n=>s.add(n))}return[...s]}
function repCats(){const s=new Set(cats());S.inv.forEach(i=>i.lines.forEach(l=>s.add(l.cat)));return[...s]}
const catOpts=sel=>cats().map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('')+'<option disabled>──────────</option><option value="__new">+ Add New Category</option>';
function addCat(n){n=cleanCat(n);if(!n)return null;const ex=cats().find(c=>c.toLowerCase()===n.toLowerCase());if(ex){if(!S.cat.some(c=>c.name===ex))S.cat.push({id:uid(),name:ex});save();return ex}S.cat.push({id:uid(),name:n});save();return n}
function catPrompt(cb,title,init,keep){
 const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(10,5,15,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px';
 d.innerHTML=`<div class="mb" style="width:min(380px,100%)"><div class="mh"><b>${title||'New category'}</b></div><div class="mc"><label>${keep?'Category name':'Enter new category name'}</label><input id="cpn" maxlength="40" value="${init||''}"></div><div class="mf"><button id="cpx">Cancel</button><button class="p" id="cps">Save</button></div></div>`;
 document.body.appendChild(d);const i=d.querySelector('#cpn');i.focus();i.select();
 const close=()=>d.remove(),ok=()=>{const n=cleanCat(i.value);if(!n){i.focus();return}close();cb(keep?n:addCat(n))};
 d.querySelector('#cpx').onclick=()=>{close();cb(null)};d.querySelector('#cps').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()}}
function catSel(s){if(s.value!=='__new'){s.dataset.prev=s.value;return}
 catPrompt(n=>{const v=n||s.dataset.prev||cats()[0]||'';s.innerHTML=catOpts(v);if(v)s.value=v;s.dataset.prev=v})}
function openCats(){
 const rows=cats().map(c=>{const n=S.items.filter(x=>x.cat===c).length;return `<tr><td>${c}</td><td class="r mu">${n} item${n===1?'':'s'}</td><td class="r"><button class="s" data-c="${c}" onclick="renCat(this.dataset.c)">Rename</button> <button class="s" data-c="${c}" onclick="delCat(this.dataset.c)">Delete</button></td></tr>`}).join('');
 modal('Manage categories',`<div class="tw"><table>${rows||'<tr><td class="mu">No categories yet.</td></tr>'}</table></div>`,()=>{catPrompt(()=>openCats());return false},'+ Add category')}
function renCat(o){catPrompt(n=>{if(!n||n===o)return openCats();
 if(cats().some(c=>c!==o&&c.toLowerCase()===n.toLowerCase())){alert('That category already exists.');return openCats()}
 const c=S.cat.find(x=>x.name===o);if(c)c.name=n;else S.cat.push({id:uid(),name:n});
 S.items.forEach(x=>{if(x.cat===o)x.cat=n});S.inv.forEach(i=>i.lines.forEach(l=>{if(l.cat===o)l.cat=n}));
 if(cat===o)cat=n;save();openCats()},'Rename category',o,true)}
function delCat(c){const n=S.items.filter(x=>x.cat===c).length;
 if(n){alert('Cannot delete "'+c+'": '+n+' item(s) use it. Rename it, or move or delete those items first.');return}
 if(!confirm('Delete category "'+c+'"?'))return;S.cat=S.cat.filter(x=>x.name!==c);if(cat===c)cat='All';save();openCats()}

function shown(k){let v=null;try{v=localStorage.getItem(SHOWK[k])}catch(e){}return v===null?k!=='sv':v==='1'}
function togM(k){try{localStorage.setItem(SHOWK[k],shown(k)?'0':'1')}catch(e){}render()}
function mcard(k,l,v,st){const s=shown(k);return `<div class='card'><div class='k'>${l} <button class='s' onclick='togM("${k}")' style='float:right;padding:1px 8px'>${s?'\ud83d\ude48 Hide':'\ud83d\udc41\ufe0f Show'}</button></div><div class='v' ${st||''}>${s?fmt(v):'\u20b9 \u2022\u2022\u2022\u2022\u2022'}</div></div>`}
function waSend(id){
 const i=S.inv.find(x=>x.id===id);if(!i)return;
 const c=S.cust.find(x=>x.id===i.cust)||{},d=(c.phone||'').replace(/\D/g,'');
 const num=d.length===10?'91'+d:d.length>=11?d.replace(/^0+/,''):'';
 const s=sub(i),T=tot(i);
 const tx='*OYRA*\nInvoice '+i.no+' \u00b7 '+i.date+'\nCustomer: '+(c.name||'')+'\n\n'+i.lines.map(l=>l.name+' x '+l.qty+' = '+fmt(l.qty*l.price*(1+l.gst/100))).join('\n')+'\n\nGST: '+fmt(T-s)+'\n*Total: '+fmt(T)+'*\nStatus: '+(i.paid?'PAID':'UNPAID')+'\n\nThank you for shopping with OYRA!';
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(tx),'_blank')
}
function backup(){const b=new Blob([JSON.stringify({app:'oyra-books',date:day(0),...S})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oyra-backup-'+day(0)+'.json';a.click()}

const tot=i=>i.lines.reduce((a,l)=>a+l.qty*l.price*(1+l.gst/100),0);

const mon=d=>d.slice(0,7)===day(0).slice(0,7);

const PL=[['today','Today'],['7','7 days'],['30','30 days'],['month','This month'],['year','This year'],['all','All time'],['custom','Custom']];
function setDP(p){DP=p;render()}
function drange(){const t=day(0);
 if(DP==='today')return[t,t];if(DP==='7')return[day(6),t];if(DP==='30')return[day(29),t];if(DP==='month')return[t.slice(0,7)+'-01',t];if(DP==='year')return[t.slice(0,4)+'-01-01',t];
 if(DP==='custom')return[DF||day(29),DT||t];
 return[S.inv.reduce((a,i)=>i.date<a?i.date:a,t),t]}
function dash(){
 const[a,b]=drange(),F=S.inv.filter(i=>i.date>=a&&i.date<=b);
 const sales=F.reduce((s,i)=>s+tot(i),0),gp=F.reduce((s,i)=>s+sub(i)-i.lines.reduce((c,l)=>c+l.qty*l.cost,0),0),ex=S.exp.filter(e=>e.date>=a&&e.date<=b).reduce((s,e)=>s+e.amt,0),due=F.filter(i=>!i.paid).reduce((s,i)=>s+tot(i),0),svv=S.items.reduce((s,x)=>s+x.stock*x.cost,0);
 const ds=[];for(let d=new Date(a),e=new Date(b);d<=e&&ds.length<1100;d.setUTCDate(d.getUTCDate()+1))ds.push(d.toISOString().slice(0,10));
 const sp=ds.length,B={},ord=[];

 return head('Reports',`<button onclick="backup()">⬇ Backup</button> <button onclick="restoreUI()">Restore</button>`)+`<div class="two"><div class="card"><div class="k">Profit &amp; Loss</div><table>${row('Sales (excl. GST)',rev)}${row('Cost of goods sold',-cogs)}${row('Gross profit',gp,'style="font-weight:700"')}${row('Expenses',-ex)}${row('Net profit',np,`style="font-weight:700;color:${np>=0?'var(--ok)':'var(--er)'}"`)}</table></div><div class="card"><div class="k">GST collected</div><div class="v">${fmt(gst)}</div><p class="mu">Output GST on all invoices, ready for GSTR-1 filing.</p></div></div><div class="card" style="margin-top:12px"><div class="k">Category-wise profit</div><table><tr><th>Category</th><th class="r">Sales</th><th class="r">Profit</th></tr>${repCats().map(c=>{const L=S.inv.flatMap(i=>i.lines).filter(l=>l.cat===c);return `<tr><td>${c}</td><td class="r">${fmt(L.reduce((a,l)=>a+l.qty*l.price,0))}</td><td class="r">${fmt(L.reduce((a,l)=>a+l.qty*(l.price-l.cost),0))}</td></tr>`}).join('')}</table></div>`;
}
let L=[];
function newInv(){
 L=[];
 modal('New sales invoice',`<div class="row"><div><label>Customer</label><select id="cu">${S.cust.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div><label>Payment</label><select id="pd"><option value="1">Paid</option><option value="0">Unpaid</option></select></div></div><label>Add item</label><div class="row"><div style="flex:1;min-width:0">${pickHTML('ai')}</div><input id="aq" type="number" value="1" style="width:70px"><button onclick="addLine()">Add</button></div><div id="ll" style="margin-top:12px"></div><label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:14px"><input type="checkbox" id="wa" style="width:auto"> Send bill on WhatsApp after saving</label>`,()=>{
  if(!L.length)return false;
  const n='OY-'+(1001+S.inv.length);const nv={id:uid(),no:n,date:day(0),cust:$('cu').value,lines:L.map(l=>({...l})),paid:$('pd').value==='1'};S.inv.push(nv);
  L.forEach(l=>{it$(l.id).stock-=l.qty});const w=$('wa').checked;save();render();if(w)waSend(nv.id)},'Save invoice');
 pkInit('ai','sale');draw();
}
function addLine(){
 const x=it$($('ai').value),q=+$('aq').value;if(!x||!q||q<1)return;
 const e=L.find(l=>l.id===x.id);if(e)e.qty+=q;else L.push({id:x.id,name:x.name,cat:x.cat,qty:q,price:x.price,cost:x.cost,gst:x.gst});draw();
}
function draw(){
 const t=L.reduce((a,l)=>a+l.qty*l.price*(1+l.gst/100),0);
 $('ll').innerHTML=L.length?`<table>${L.map((l,i)=>`<tr><td>${thumb(it$(l.id),24)} ${l.name}</td><td class="r">${l.qty} × ${fmt(l.price)}</td><td class="r">${fmt(l.qty*l.price*(1+l.gst/100))}</td><td class="r"><button class="s" onclick="L.splice(${i},1);draw()">✕</button></td></tr>`).join('')}</table><p class="r"><b style="font-size:17px">Total incl. GST: ${fmt(t)}</b></p>`:'<p class="mu">No items added yet.</p>';
}
function modal(t,b,ok,txt){
 $('M').innerHTML=`<div class="mb"><div class="mh"><b>${t}</b><button class="s" onclick="closeM()">✕</button></div><div class="mc">${b}</div><div class="mf"><button onclick="closeM()">Close</button><button class="p" id="ok">${txt||'Save'}</button></div></div>`;
 document.body.classList.add('mo');$('M').style.display='flex';$('ok').onclick=()=>{if(ok()!==false)closeM()};
}
function closeM(){document.body.classList.remove('mo');$('M').style.display='none';$('M').innerHTML=''}
let TH='gold';try{const q=localStorage.getItem('oyra-theme');if(q!==null)TH=q}catch(e){}
function applyTheme(){if(TH)document.documentElement.setAttribute('data-theme',TH);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){TH=TH===''?'gold':TH==='gold'?'green':'';try{localStorage.setItem('oyra-theme',TH)}catch(e){}applyTheme()}
applyTheme();render();
</script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,getDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=window.FIREBASE_CONFIG||{},OWN=(window.OWNER_EMAIL||'').toLowerCase(),COL=['items','cust','inv','exp','pur','cat'];
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
if(!C.apiKey||C.apiKey.startsWith('PASTE')){authErr({message:'Firebase settings are not added yet. Open index.html and paste them at the top.'})}
else{
const app=initializeApp(C),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let M={},R={},U=[];
const reset=()=>{U.forEach(f=>f());U=[];COL.forEach(c=>{M[c]={};R[c]={}})};reset();
const bad=e=>{console.error(e);sv('Not synced: '+(e.code||'error'))};
window.FB={
 login(){const p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(e=>{if(e.code==='auth/popup-blocked')signInWithRedirect(auth,p);else if(e.code!=='auth/popup-closed-by-user')authErr(e)})},
 logout(){signOut(auth)},
 sync(S){COL.forEach(c=>{const cur={};S[c].forEach(x=>{cur[x.id]=x});Object.keys(cur).forEach(id=>{const j=sj(cur[id]);if(R[c][id]!==j){R[c][id]=j;setDoc(doc(db,c,id),cur[id]).catch(bad)}});Object.keys(R[c]).forEach(id=>{if(!cur[id]){delete R[c][id];deleteDoc(doc(db,c,id)).catch(bad)}})})},
 addStaff(e){setDoc(doc(db,'staff',e),{email:e}).catch(bad)},
 delStaff(e){deleteDoc(doc(db,'staff',e)).catch(bad)}
};
onAuthStateChanged(auth,async u=>{
 reset();
 if(!u){onAuth(null);return}
 const e=(u.email||'').toLowerCase();let role=null;
 if(e===OWN)role='owner';else{try{role=(await getDoc(doc(db,'staff',e))).exists()?'staff':null}catch(x){}}
 onAuth(role,e);
 if(!role)return;
 COL.forEach(c=>U.push(onSnapshot(collection(db,c),s=>{s.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){delete M[c][id];delete R[c][id]}else{M[c][id]=ch.doc.data();R[c][id]=sj(M[c][id])}});onData(c,Object.values(M[c]),s.metadata.fromCache);if(!s.metadata.fromCache&&!s.metadata.hasPendingWrites)sv(EMAIL+' \u00b7 '+role+' \u00b7 synced')},bad)));
 if(role==='owner')U.push(onSnapshot(collection(db,'staff'),s=>onStaff(s.docs.map(d=>d.id).sort()),bad));
});
}
</script>
